<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>마이키티 — 클릭 프로토타입</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/components.css" />
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="rough" x="-10%" y="-20%" width="120%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035 0.09" numOctaves="3" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="device" id="device">
  <main class="screen" id="screen"></main>
  <div class="disclosure">이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</div>
  <nav class="tabbar" id="tabbar"></nav>

  <div class="sheet-wrap" id="sheet">
    <div class="dim"></div>
    <div class="sheet"><div class="handle"></div><div id="sheet-inner" style="display:contents"></div></div>
  </div>
</div>

<script src="data/worlds.js"></script>
<script src="data/figures.js"></script>
<script src="data/rankings.js"></script>
<script src="js/store.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
